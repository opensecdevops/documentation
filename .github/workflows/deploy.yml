name: Deploy Documentación a Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docusaurus y Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Docusaurus usa git history para "last updated"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: documentation/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: documentation

      - name: Build Docusaurus
        run: npm run build
        working-directory: documentation
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Deploy a Netlify (producción)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: documentation/build
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }} — ${{ github.event.head_commit.message }}"
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy Preview (PRs)
        if: github.event_name == 'pull_request'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: documentation/build
          production-branch: main
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR Preview — ${{ github.event.pull_request.title }}"
          alias: "pr-${{ github.event.number }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: URL del deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "## Documentación desplegada" >> "$GITHUB_STEP_SUMMARY"
          echo "La documentación de OSDO ha sido actualizada en Netlify." >> "$GITHUB_STEP_SUMMARY"
